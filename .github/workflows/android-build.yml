name: Build Android APK (PySide6)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"
      QT_VERSION: "6.8.3"
      WHEELS_DIR: "./wheels"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # PySide6 содержит pyside6-android-deploy
          pip install PySide6==${{ env.QT_VERSION }}
          # buildozer нужен pyside6-android-deploy под капотом
          pip install buildozer
          # qtpip для скачивания Android-колес
          pip install qtpip
          # cython нужен buildozer
          pip install cython

      - name: Prepare wheels directory
        run: mkdir -p ${{ env.WHEELS_DIR }}

      - name: Download PySide6 and Shiboken6 Android wheels
        run: |
          qtpip download \
            --platform android_aarch64 \
            --python-version ${{ env.PYTHON_VERSION }} \
            --dest ${{ env.WHEELS_DIR }} \
            PySide6==${{ env.QT_VERSION }} \
            shiboken6==${{ env.QT_VERSION }}

      - name: Verify downloaded wheels
        run: ls -lh ${{ env.WHEELS_DIR }}

      - name: Build APK
        run: |
          pyside6-android-deploy \
            --wheel-pyside=${{ env.WHEELS_DIR }}/PySide6-${{ env.QT_VERSION }}-cp311-cp311-android_aarch64.whl \
            --wheel-shiboken=${{ env.WHEELS_DIR }}/shiboken6-${{ env.QT_VERSION }}-cp311-cp311-android_aarch64.whl \
            --project-path=. \
            --spec-file=pysidedeploy.spec \
            --force

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brick-emu-apk
          path: |
            *.apk
            *.aab
