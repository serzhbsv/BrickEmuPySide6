name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  QT_VERSION: 6.8.3
  WHEELS_DIR: ./wheels
  ANDROID_ARCH: aarch64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyproject-metadata setuptools wheel
          # Устанавливаем десктопный PySide6 — нужен только ради
          # консольной команды pyside6-android-deploy и патча
          pip install PySide6==${{ env.QT_VERSION }}

      - name: Cache pyside6-android-deploy
        uses: actions/cache@v4
        with:
          path: ~/.pyside6-android-deploy
          key: pyside6-deploy-${{ env.QT_VERSION }}-v1

      - name: Cache Android wheels
        uses: actions/cache@v4
        with:
          path: ${{ env.WHEELS_DIR }}
          key: wheels-android-${{ env.QT_VERSION }}-${{ env.ANDROID_ARCH }}-v1

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v1

      - name: Download Android wheels
        run: |
          mkdir -p ${{ env.WHEELS_DIR }}
          QT_MIRROR="https://download.qt.io/official_releases/QtForPython"

          wget -q --show-progress -O ${{ env.WHEELS_DIR }}/PySide6-android.whl \
            "$QT_MIRROR/pyside6/PySide6-${{ env.QT_VERSION }}-${{ env.QT_VERSION }}-cp311-cp311-android_${{ env.ANDROID_ARCH }}.whl"

          wget -q --show-progress -O ${{ env.WHEELS_DIR }}/shiboken6-android.whl \
            "$QT_MIRROR/shiboken6/shiboken6-${{ env.QT_VERSION }}-${{ env.QT_VERSION }}-cp311-cp311-android_${{ env.ANDROID_ARCH }}.whl"

          echo "Downloaded wheels:"
          ls -lh ${{ env.WHEELS_DIR }}/

      - name: Patch android_deploy.py to inject assets config
        run: |
          cat > /tmp/patch_deploy.py << 'PATCH'
          import PySide6, os

          deploy_script = os.path.join(os.path.dirname(PySide6.__file__), 'scripts', 'android_deploy.py')
          print(f'Reading: {deploy_script}')

          with open(deploy_script) as f:
              lines = f.readlines()

          marker = 'Running buildozer deployment'
          marker_idx = None
          for i, line in enumerate(lines):
              if marker in line:
                  marker_idx = i
                  print(f'Found marker at line {i+1}: {line.rstrip()}')
                  print('--- Context BEFORE patch ---')
                  for j in range(max(0, i-10), min(len(lines), i+6)):
                      print(f'{j+1:4d}: {lines[j]}', end='')
                  print('--- End ---')
                  break

          if marker_idx is None:
              print('ERROR: marker not found')
              exit(1)

          indent = len(lines[marker_idx]) - len(lines[marker_idx].lstrip())
          print(f'Indentation: {indent} spaces')

          pad = ' ' * indent
          inject = [
              pad + '# --- Patch: inject assets into buildozer.spec ---\n',
              pad + 'with open("buildozer.spec", "a") as _f:\n',
              pad + '    _f.write("source.include_patterns = assets/*,assets/**/*\\n")\n',
              pad + '    _f.write("android.add_assets = assets\\n")\n',
              pad + '# --- End patch ---\n',
          ]

          new_lines = lines[:marker_idx] + inject + lines[marker_idx:]
          with open(deploy_script, 'w') as f:
              f.writelines(new_lines)

          print(f'Patch applied: inserted {len(inject)} lines at indentation {indent}')

          # Вывод содержимого файла после патча
          print('\n========== FULL android_deploy.py AFTER PATCH ==========')
          with open(deploy_script) as f:
              for i, line in enumerate(f, 1):
                  print(f'{i:4d}: {line}', end='')
          print('\n========== END ==========')
          PATCH

          python /tmp/patch_deploy.py

      - name: Create manifest arguments file
        run: |
          echo 'android:allowNativeHeapPointerTagging="false"' > extra_manifest_app_arguments.xml
          cat extra_manifest_app_arguments.xml

      - name: Fix sdkmanager path for buildozer
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          mkdir -p "$SDK_ROOT/tools/bin"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                 "$SDK_ROOT/tools/bin/sdkmanager"
          echo "Symlink created:"
          ls -la "$SDK_ROOT/tools/bin/sdkmanager"
          "$SDK_ROOT/tools/bin/sdkmanager" --version


      - name: Build APK
        env:
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/27.3.13750724
        run: |
          # Запускаем патчер в фоне — он дождётся клонирования p4a и пропатчит libffi
          /tmp/patch_libffi_recipe.sh &

          PYSIDE_WHEEL="./wheels/PySide6-android.whl"
          SHIBOKEN_WHEEL="./wheels/shiboken6-android.whl"

          pyside6-android-deploy \
            -c pysidedeploy.spec \
            -f \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --ndk-path="$ANDROID_NDK_HOME" \
            --sdk-path="$ANDROID_SDK_ROOT" \
            --name=BrickEmu

      - name: Verify .brick files in APK
        run: |
          APK=$(find . -name "*.apk" | head -1)
          echo "APK: $APK"
          if [ -n "$APK" ]; then
            unzip -l "$APK" | grep -i "\.brick" || echo "No .brick files found in APK!"
            unzip -l "$APK" | grep -i "assets" | head -20 || echo "No assets found in APK!"
          fi

      - name: Find p4a build dirs
        if: always()
        run: |
          echo "=== ~/.pyside6-android-deploy ==="
          du -sh ~/.pyside6-android-deploy/ 2>/dev/null || echo "not found"
          echo "=== find p4a build ==="
          find /tmp -name "p4a-*" -type d 2>/dev/null | head -10
          echo "=== largest /tmp dirs ==="
          du -sh /tmp/* 2>/dev/null | sort -rh | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrickEmuPy.apk
          path: |
            *.apk
            build/*.apk
