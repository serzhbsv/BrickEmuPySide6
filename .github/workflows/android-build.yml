name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  QT_VERSION: 6.8.3
  WHEELS_DIR: ./wheels

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyproject-metadata setuptools wheel

      - name: Cache pyside6-android-deploy
        uses: actions/cache@v4
        with:
          path: ~/.pyside6-android-deploy
          key: pyside6-deploy-${{ env.QT_VERSION }}-v1

      - name: Cache wheels
        uses: actions/cache@v4
        with:
          path: ${{ env.WHEELS_DIR }}
          key: wheels-pyside6-${{ env.QT_VERSION }}-v1

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v1

      - name: Download wheels
        run: |
          mkdir -p ${{ env.WHEELS_DIR }}
          pip download PySide6==${{ env.QT_VERSION }} shiboken6==${{ env.QT_VERSION }} \
            --only-binary=:all: \
            --dest ${{ env.WHEELS_DIR }} \
            --platform any

      - name: Patch pyside6-android-deploy for assets
        run: |
          python -c "
          import PySide6, os, re

          base = os.path.dirname(PySide6.__file__)
          patched = False

          for root, dirs, files in os.walk(base):
              for f in files:
                  if not f.endswith('.py'):
                      continue
                  path = os.path.join(root, f)
                  try:
                      with open(path) as fh:
                          content = fh.read()
                  except:
                      continue

                  modified = False

                  # 1) Add source.include_patterns for assets/ if not present
                  if 'include_exts' in content and 'include_patterns' not in content:
                      # Insert include_patterns before include_exts
                      content = re.sub(
                          r'(source\.include_exts\s*=)',
                          r'source.include_patterns = assets/*,assets/**/*\n\1',
                          content
                      )
                      modified = True

                  # 2) Add android.add_assets = assets if not present
                  if 'android.add_assets' not in content and 'include_exts' in content:
                      content = re.sub(
                          r'(source\.include_exts\s*=)',
                          r'android.add_assets = assets\n\1',
                          content
                      )
                      modified = True

                  # 3) If include_patterns already exists but doesn't mention assets
                  if 'include_patterns' in content and 'assets/' not in content:
                      content = re.sub(
                          r'(source\.include_patterns\s*=\s*)',
                          r'\1assets/*,assets/**/*,',
                          content
                      )
                      modified = True

                  if modified:
                      with open(path, 'w') as fh:
                          fh.write(content)
                      print(f'Patched: {path}')
                      patched = True

          if not patched:
              print('WARNING: No files were patched!')
              print('Searching for buildozer.spec generation...')
              for root, dirs, files in os.walk(base):
                  for f in files:
                      if not f.endswith('.py'):
                          continue
                      path = os.path.join(root, f)
                      try:
                          with open(path) as fh:
                              content = fh.read()
                      except:
                          continue
                      if 'buildozer' in content.lower() and 'spec' in content.lower():
                          print(f'  Candidate: {path}')
          "

      - name: Create manifest arguments file
        run: |
          echo 'android:allowNativeHeapPointerTagging="false"' > extra_manifest_app_arguments.xml
          cat extra_manifest_app_arguments.xml

      - name: Build APK
        run: |
          PYSIDE_WHEEL=$(find ${{ env.WHEELS_DIR }} -name "PySide6*.whl" | head -1)
          SHIBOKEN_WHEEL=$(find ${{ env.WHEELS_DIR }} -name "shiboken6*.whl" | head -1)

          echo "PySide6 wheel: $PYSIDE_WHEEL"
          echo "Shiboken6 wheel: $SHIBOKEN_WHEEL"

          pyside6-android-deploy \
            -c pysidedeploy.spec \
            -f \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --ndk-path="$ANDROID_NDK_HOME" \
            --sdk-path="$ANDROID_SDK_ROOT" \
            --name=BrickEmu

      - name: Verify .brick files in APK
        run: |
          APK=$(find . -name "*.apk" | head -1)
          echo "APK: $APK"
          if [ -n "$APK" ]; then
            unzip -l "$APK" | grep -i "\.brick" || echo "No .brick files found in APK!"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrickEmuPy.apk
          path: |
            *.apk
            build/*.apk
