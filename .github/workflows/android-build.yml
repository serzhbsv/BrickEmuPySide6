name: Build Android APK (PySide6)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    env:
      PYTHON_VERSION: "3.11"
      QT_VERSION: "6.8.3"
      NDK_VERSION: "r27c"
      # Пути к инструментам, которые скачает pyside-setup
      ANDROID_NDK: "\${{ github.home }}/.pyside6_android_deploy/android-ndk/android-ndk-r27c"
      ANDROID_SDK: "\${{ github.home }}/.pyside6_android_deploy/android-sdk/"
      WHEELS_DIR: "\${{ github.workspace }}/wheels"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: \${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # 1. Ставим сам инструмент деплоя (решает ошибку command not found)
          pip install pyside6-android-deploy
          # 2. Ставим qtpip для скачивания колес
          pip install qtpip

      - name: Prepare wheels directory
        run: mkdir -p \${{ env.WHEELS_DIR }}

      - name: Download PySide6 and Shiboken6 wheels
        # Скачиваем колеса для архитектуры aarch64 (стандарт для современных телефонов)
        run: |
          qtpip download \
            --platform android_aarch64 \
            --python-version \${{ env.PYTHON_VERSION }} \
            --dest \${{ env.WHEELS_DIR }} \
            PySide6==\${{ env.QT_VERSION }} \
            shiboken6==\${{ env.QT_VERSION }}

      - name: Verify downloaded wheels
        run: ls -lh \${{ env.WHEELS_DIR }}

      - name: Build APK with pyside6-android-deploy
        run: |
          # Очищаем кэш предыдущей сборки, если есть
          rm -rf .buildozer
          
          # Запускаем сборку
          pyside6-android-deploy \
            --wheel-pyside=${{ env.WHEELS_DIR }}/PySide6-${{ env.QT_VERSION }}-cp311-cp311-android_aarch64.whl \
            --wheel-shiboken=${{ env.WHEELS_DIR }}/shiboken6-${{ env.QT_VERSION }}-cp311-cp311-android_aarch64.whl \
            --ndk-path=\${{ env.ANDROID_NDK }} \
            --sdk-path=\${{ env.ANDROID_SDK }} \
            --project-path=. \
            --spec-file=pysidedeploy.spec

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brick-emu-apk
          path: |
            *.apk
            *.aab

