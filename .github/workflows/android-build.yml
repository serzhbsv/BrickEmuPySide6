name: Build Android APK (PySide6)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"
      QT_VERSION: "6.8.3"
      WHEELS_DIR: "./wheels"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==${{ env.QT_VERSION }}
          pip install buildozer cython qtpip

      - name: Prepare wheels directory
        run: mkdir -p ${{ env.WHEELS_DIR }}

      - name: Download PySide6 and Shiboken6 Android wheels
        run: |
          qtpip download PySide6 --android --arch aarch64 --dest ${{ env.WHEELS_DIR }}
          qtpip download shiboken6 --android --arch aarch64 --dest ${{ env.WHEELS_DIR }}

      - name: Verify downloaded wheels
        run: ls -lh ${{ env.WHEELS_DIR }}

      - name: Build APK
        run: |
          # Находим скачанные колёса автоматически
          PYSIDE_WHEEL=$(find ${{ env.WHEELS_DIR }} -name "PySide6*.whl" | head -1)
          SHIBOKEN_WHEEL=$(find ${{ env.WHEELS_DIR }} -name "shiboken6*.whl" | head -1)
          
          echo "PySide6 wheel: $PYSIDE_WHEEL"
          echo "Shiboken6 wheel: $SHIBOKEN_WHEEL"
          
          if [ -z "$PYSIDE_WHEEL" ] || [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "ERROR: Wheels not found!"
            exit 1
          fi
          
          pyside6-android-deploy \
            -c pysidedeploy.spec \
            -f \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --name=BrickEmu

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brick-emu-apk
          path: |
            *.apk
            *.aab
