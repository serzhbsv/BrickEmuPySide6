name: Build Android APK (PySide6)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"
      QT_VERSION: "6.8.3"
      WHEELS_DIR: "./wheels"
      NDK_VERSION: "r27c"
      ANDROID_NDK_HOME: "${{ github.workspace }}/android-ndk-${{ env.NDK_VERSION }}"
      ANDROID_SDK_ROOT: "${{ github.workspace }}/android-sdk"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==${{ env.QT_VERSION }} buildozer cython jinja2

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_NDK_HOME }}
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          curl -L -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip"
          unzip -q ndk.zip -d ${{ github.workspace }}
          rm ndk.zip

      - name: Setup Android SDK with cmdline-tools
        run: |
          mkdir -p ${{ env.ANDROID_SDK_ROOT }}
          curl -L -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11576660.zip"
          unzip -q cmdline-tools.zip -d ${{ env.ANDROID_SDK_ROOT }}/temp
          mkdir -p ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools
          mv ${{ env.ANDROID_SDK_ROOT }}/temp/cmdline-tools ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest
          rm -rf ${{ env.ANDROID_SDK_ROOT }}/temp

      - name: Accept Android SDK licenses
        run: |
          yes | ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK components
        run: |
          ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Create sdkmanager symlink for buildozer
        run: |
          SDK_DIR=${{ env.ANDROID_SDK_ROOT }}
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          ls -la "$SDK_DIR/tools/bin/"

      - name: Download Android wheels from Qt mirror
        run: |
          mkdir -p ${{ env.WHEELS_DIR }}
          
          curl -L -o ${{ env.WHEELS_DIR }}/PySide6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl \
            "https://mirror.yandex.ru/mirrors/qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl"
          
          curl -L -o ${{ env.WHEELS_DIR }}/shiboken6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl \
            "https://mirror.yandex.ru/mirrors/qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl"
          
          echo "=== Downloaded wheels ==="
          ls -lh ${{ env.WHEELS_DIR }}/

      - name: Build APK
        run: |
          PYSIDE_WHEEL=$(find ${{ env.WHEELS_DIR }} -name "PySide6*.whl" | head -1)
          SHIBOKEN_WHEEL=$(find ${{ env.WHEELS_DIR }} -name "shiboken6*.whl" | head -1)
          
          echo "PySide6 wheel: $PYSIDE_WHEEL"
          echo "Shiboken6 wheel: $SHIBOKEN_WHEEL"
          
          if [ -z "$PYSIDE_WHEEL" ] || [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "ERROR: Wheels not found!"
            exit 1
          fi
          
          pyside6-android-deploy \
            -c pysidedeploy.spec \
            -f \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --ndk-path="${{ env.ANDROID_NDK_HOME }}" \
            --sdk-path="${{ env.ANDROID_SDK_ROOT }}" \
            --name=BrickEmu

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brick-emu-apk
          path: |
            *.apk
            *.aab
