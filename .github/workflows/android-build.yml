name: Build Android APK (PySide6)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"
      QT_VERSION: "6.8.3"
      WHEELS_DIR: "./wheels"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==${{ env.QT_VERSION }}
          pip install buildozer cython

      - name: Download NDK and SDK via Qt script
        run: |
          git clone https://code.qt.io/pyside/pyside-setup.git /tmp/pyside-setup
          cd /tmp/pyside-setup
          python tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Create sdkmanager symlink (buildozer compatibility)
        run: |
          SDK_DIR="$HOME/.pyside6_android_deploy/android-sdk"
          if [ -d "$SDK_DIR" ]; then
            mkdir -p "$SDK_DIR/tools/bin"
            if [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
              ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
            fi
            ls -la "$SDK_DIR/tools/bin/"
          else
            echo "SDK not found at $SDK_DIR, checking alternatives..."
            find "$HOME/.pyside6_android_deploy" -name sdkmanager 2>/dev/null || true
          fi

      - name: Download Android wheels from Qt mirror
        run: |
          mkdir -p ${{ env.WHEELS_DIR }}
          
          curl -L -o ${{ env.WHEELS_DIR }}/PySide6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl \
            "https://mirror.yandex.ru/mirrors/qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl"
          
          curl -L -o ${{ env.WHEELS_DIR }}/shiboken6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl \
            "https://mirror.yandex.ru/mirrors/qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl"
          
          echo "=== Downloaded wheels ==="
          ls -lh ${{ env.WHEELS_DIR }}/

      - name: Build APK
        run: |
          PYSIDE_WHEEL=$(find ${{ env.WHEELS_DIR }} -name "PySide6*.whl" | head -1)
          SHIBOKEN_WHEEL=$(find ${{ env.WHEELS_DIR }} -name "shiboken6*.whl" | head -1)
          
          echo "PySide6 wheel: $PYSIDE_WHEEL"
          echo "Shiboken6 wheel: $SHIBOKEN_WHEEL"
          
          if [ -z "$PYSIDE_WHEEL" ] || [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "ERROR: Wheels not found!"
            exit 1
          fi
          
          pyside6-android-deploy \
            -c pysidedeploy.spec \
            -f \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --name=BrickEmu

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brick-emu-apk
          path: |
            *.apk
            *.aab
