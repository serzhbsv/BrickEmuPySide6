name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  QT_VERSION: 6.8.3
  WHEELS_DIR: ./wheels
  ANDROID_ARCH: aarch64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyproject-metadata setuptools wheel
          # Устанавливаем десктопный PySide6 — нужен только ради
          # консольной команды pyside6-android-deploy и патча
          pip install PySide6==${{ env.QT_VERSION }}

      - name: Cache pyside6-android-deploy
        uses: actions/cache@v4
        with:
          path: ~/.pyside6-android-deploy
          key: pyside6-deploy-${{ env.QT_VERSION }}-v1

      - name: Cache Android wheels
        uses: actions/cache@v4
        with:
          path: ${{ env.WHEELS_DIR }}
          key: wheels-android-${{ env.QT_VERSION }}-${{ env.ANDROID_ARCH }}-v1

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v1

      - name: Download Android wheels
        run: |
          mkdir -p ${{ env.WHEELS_DIR }}
          QT_MIRROR="https://download.qt.io/official_releases/QtForPython"

          wget -q --show-progress -O ${{ env.WHEELS_DIR }}/PySide6-android.whl \
            "$QT_MIRROR/pyside6/PySide6-${{ env.QT_VERSION }}-${{ env.QT_VERSION }}-cp311-cp311-android_${{ env.ANDROID_ARCH }}.whl"

          wget -q --show-progress -O ${{ env.WHEELS_DIR }}/shiboken6-android.whl \
            "$QT_MIRROR/shiboken6/shiboken6-${{ env.QT_VERSION }}-${{ env.QT_VERSION }}-cp311-cp311-android_${{ env.ANDROID_ARCH }}.whl"

          echo "Downloaded wheels:"
          ls -lh ${{ env.WHEELS_DIR }}/

      - name: Patch pyside6-android-deploy for assets
        run: |
          python -c "
          import PySide6, os, re

          base = os.path.dirname(PySide6.__file__)
          patched = False

          for root, dirs, files in os.walk(base):
              for f in files:
                  if not f.endswith('.py'):
                      continue
                  path = os.path.join(root, f)
                  try:
                      with open(path) as fh:
                          content = fh.read()
                  except:
                      continue

                  modified = False

                  # 1) Add source.include_patterns for assets/ if not present
                  if 'include_exts' in content and 'include_patterns' not in content:
                      content = re.sub(
                          r'(source\.include_exts\s*=)',
                          r'source.include_patterns = assets/*,assets/**/*\n\1',
                          content
                      )
                      modified = True

                  # 2) Add android.add_assets = assets if not present
                  if 'android.add_assets' not in content and 'include_exts' in content:
                      content = re.sub(
                          r'(source\.include_exts\s*=)',
                          r'android.add_assets = assets\n\1',
                          content
                      )
                      modified = True

                  # 3) If include_patterns already exists but doesn't mention assets
                  if 'include_patterns' in content and 'assets/' not in content:
                      content = re.sub(
                          r'(source\.include_patterns\s*=\s*)',
                          r'\1assets/*,assets/**/*,',
                          content
                      )
                      modified = True

                  if modified:
                      with open(path, 'w') as fh:
                          fh.write(content)
                      print(f'Patched: {path}')
                      patched = True

          if not patched:
              print('WARNING: No files were patched!')
              for root, dirs, files in os.walk(base):
                  for f in files:
                      if not f.endswith('.py'):
                          continue
                      path = os.path.join(root, f)
                      try:
                          with open(path) as fh:
                              content = fh.read()
                      except:
                          continue
                      if 'buildozer' in content.lower() and 'spec' in content.lower():
                          print(f'  Candidate: {path}')
          "

      - name: Patch android_deploy.py to inject assets config
        run: |
          python -c "
          import PySide6, os

          deploy_script = os.path.join(os.path.dirname(PySide6.__file__), 'scripts', 'android_deploy.py')
          print(f'Patching: {deploy_script}')

          with open(deploy_script) as f:
              content = f.read()

          # Находим строку запуска buildozer и вставляем патч buildozer.spec перед ней
          marker = 'logging.info(\"[DEPLOY] Running buildozer deployment\")'
          if marker not in content:
              # Запасной вариант
              marker = 'subprocess.run'
              idx = content.find(marker)
              if idx == -1:
                  print('WARNING: Could not find buildozer launch point')
                  exit(0)
              # Ищем начало блока
              while idx > 0 and content[idx] != '\n':
                  idx -= 1
          else:
              idx = content.find(marker)

          inject = '''
          # --- Patch: inject assets into buildozer.spec ---
          with open(\"buildozer.spec\", \"a\") as _f:
              _f.write(\"\\nsource.include_patterns = assets/*,assets/**/*\\n\")
              _f.write(\"android.add_assets = assets\\n\")
          # --- End patch ---
          '''

          content = content[:idx] + inject + '\n' + content[idx:]

          with open(deploy_script, 'w') as f:
              f.write(content)

          print('Patch applied successfully')
          "


      - name: Create manifest arguments file
        run: |
          echo 'android:allowNativeHeapPointerTagging="false"' > extra_manifest_app_arguments.xml
          cat extra_manifest_app_arguments.xml

      - name: Build APK
        run: |
          PYSIDE_WHEEL="${{ env.WHEELS_DIR }}/PySide6-android.whl"
          SHIBOKEN_WHEEL="${{ env.WHEELS_DIR }}/shiboken6-android.whl"

          echo "PySide6 wheel: $PYSIDE_WHEEL"
          echo "Shiboken6 wheel: $SHIBOKEN_WHEEL"

          pyside6-android-deploy \
            -c pysidedeploy.spec \
            -f \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --ndk-path="$ANDROID_NDK_HOME" \
            --sdk-path="$ANDROID_SDK_ROOT" \
            --name=BrickEmu

      - name: Verify .brick files in APK
        run: |
          APK=$(find . -name "*.apk" | head -1)
          echo "APK: $APK"
          if [ -n "$APK" ]; then
            unzip -l "$APK" | grep -i "\.brick" || echo "No .brick files found in APK!"
            unzip -l "$APK" | grep -i "assets" | head -20 || echo "No assets found in APK!"
          fi

      - name: Find p4a build dirs
        if: always()
        run: |
          echo "=== ~/.pyside6-android-deploy ==="
          du -sh ~/.pyside6-android-deploy/ 2>/dev/null || echo "not found"
          echo "=== find p4a build ==="
          find /tmp -name "p4a-*" -type d 2>/dev/null | head -10
          echo "=== largest /tmp dirs ==="
          du -sh /tmp/* 2>/dev/null | sort -rh | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrickEmuPy.apk
          path: |
            *.apk
            build/*.apk
